<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Rune Door</title>

<style>

body{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
}

h1{
    margin-top:20px;
}

#door{
    width:700px;
    height:900px;

    margin:auto;
    margin-top:20px;

    position:relative;

    background-image:url("door.jpg");
    background-size:cover;
    background-position:center;

    border:4px solid #444;
}

.rune{
    width:80px;
    height:80px;

    border-radius:50%;

    border:3px solid #888;

    background:#222;

    color:white;

    font-size:40px;

    position:absolute;

    cursor:pointer;

    transition:0.3s;
}

.correct{
    background:#00ff00;
    box-shadow:0 0 20px lime;
}

.wrong{
    background:#ff0000;
    box-shadow:0 0 20px red;
}

#message{
    margin-top:20px;
    font-size:24px;
}

</style>
</head>

<body>

<h1>The Rune Door</h1>

<div id="door">

<button class="rune" id="r1" style="top:150px;left:120px;">ᚠ</button>

<button class="rune" id="r2" style="top:150px;right:120px;">ᚢ</button>

<button class="rune" id="r3" style="bottom:250px;left:120px;">ᚦ</button>

<button class="rune" id="r4" style="bottom:250px;right:120px;">ᚱ</button>

</div>

<div id="message"></div>

<script>

// CHANGE THIS TO YOUR SECRET SEQUENCE
const solution = ["r3","r1","r4","r2"];

let progress = 0;

document.querySelectorAll(".rune").forEach(button => {

    button.addEventListener("click", () => {

        const expected = solution[progress];

        if(button.id === expected){

            button.classList.add("correct");

            progress++;

            if(progress === solution.length){

                document.getElementById("message").innerHTML =
                "The ancient mechanism groans and the door opens.";

                setTimeout(() => {
                    document.getElementById("door").style.opacity = "0.2";
                },1000);

            }

        } else {

            flashRed();

        }

    });

});

function flashRed(){

    const runes = document.querySelectorAll(".rune");

    runes.forEach(r => r.classList.add("wrong"));

    setTimeout(() => {

        runes.forEach(r => {
            r.classList.remove("wrong");
            r.classList.remove("correct");
        });

        progress = 0;

    },1000);

}

</script>

</body>
</html>
