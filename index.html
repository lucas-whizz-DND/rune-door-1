<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>The Rune Door</title>

<style>

body{
    position:relative;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    overflow:hidden;
}

h1{
    margin-top:20px;
}

#door{
    width:700px;
    height:900px;

    margin:auto;
    margin-top:20px;

    position:relative;

    background-image:url("door.jpg");
    background-size:cover;
    background-position:center;

    border:4px solid #444;

    transition:opacity 4s ease;
}

.rune{
    width:70px;
    height:70px;

    border-radius:50%;

    border:3px solid #888;

    background:#222;

    color:white;

    font-size:40px;

    position:absolute;

    cursor:pointer;

    transition:0.3s;
}

.correct{
    background:#00ff00;
    box-shadow:
        0 0 10px lime,
        0 0 20px lime,
        0 0 30px lime;
}

.wrong{
    background:#ff0000;
    box-shadow:
        0 0 10px red,
        0 0 20px red,
        0 0 30px red;
}

/* MESSAGE */
#message{
    position:fixed;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    font-size:52px;
    font-weight:bold;

    color:#fff;

    text-align:center;

    text-shadow:
        0 0 10px #fff,
        0 0 20px #fff,
        0 0 40px #fff;

    opacity:0;

    transition:opacity 2s ease;

    pointer-events:none;

    width:80%;
}

/* SEAL STYLE */
#message.sealed{
    color:#ff3b3b;
    text-shadow:
        0 0 10px #ff3b3b,
        0 0 20px #ff3b3b,
        0 0 40px #ff3b3b;
}

#message.show{
    opacity:1;
}

</style>
</head>

<body>

<h1>The Rune Door</h1>

<div id="door">

    <button class="rune" id="r1" style="top:330px;left:255px;">ᚠ</button>
    <button class="rune" id="r2" style="top:330px;left:370px;">ᚢ</button>
    <button class="rune" id="r3" style="top:440px;left:255px;">ᚦ</button>
    <button class="rune" id="r4" style="top:440px;left:370px;">ᚱ</button>

</div>

<div id="message">
    The mechanism inside the door begins to spin.
</div>

<script>

// correct sequence
const solution = ["r3","r1","r4","r2"];

let progress = 0;
let failures = 0;
let locked = false;

const door = document.getElementById("door");
const message = document.getElementById("message");

document.querySelectorAll(".rune").forEach(button => {

    button.addEventListener("click", () => {

        if(locked) return;

        const expected = solution[progress];

        if(button.id === expected){

            button.classList.add("correct");
            progress++;

            if(progress === solution.length){
                openDoor();
            }

        } else {
            flashRed();
        }

    });

});

function flashRed(){

    if(locked) return;

    failures++;
    progress = 0;

    const runes = document.querySelectorAll(".rune");

    runes.forEach(r => r.classList.add("wrong"));

    setTimeout(() => {

        runes.forEach(r => {
            r.classList.remove("wrong");
            r.classList.remove("correct");
        });

    }, 1000);

    if(failures >= 5){
        lockDoor();
    }
}

function lockDoor(){

    locked = true;

    document.querySelectorAll(".rune").forEach(r => {
        r.disabled = true;
    });

    // fade out door first
    setTimeout(() => {
        door.style.opacity = "0";
    }, 500);

    // then show sealed message
    setTimeout(() => {
        message.textContent = "The runes flare violently... and the door seals shut.";
        message.classList.add("show", "sealed");
    }, 1500);
}

function openDoor(){

    document.querySelectorAll(".rune").forEach(r => {
        r.disabled = true;
    });

    setTimeout(() => {
        door.style.opacity = "0";
    }, 500);

    setTimeout(() => {
        message.classList.add("show");
    }, 1500);
}

</script>

</body>
</html>
